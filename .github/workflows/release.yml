name: Release

# A version tag (v0.1.0) builds the Windows exe and publishes it as a GitHub release.
# A manual run only builds it, and keeps the zip as an artifact of the run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: pytest

      - name: Build the exe
        run: >
          pyinstaller --noconfirm --onedir --console --name phonedeck
          --collect-submodules winrt --collect-all segno --paths src
          packaging/launcher.py
      - name: Check that the exe starts
        run: dist\phonedeck\phonedeck.exe --help

      - name: Zip it and write a checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/phonedeck -DestinationPath phonedeck-windows-x64.zip
          $hash = (Get-FileHash phonedeck-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  phonedeck-windows-x64.zip" | Out-File -Encoding ascii phonedeck-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: phonedeck-windows-x64
          path: |
            phonedeck-windows-x64.zip
            phonedeck-windows-x64.zip.sha256

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          phonedeck-windows-x64.zip phonedeck-windows-x64.zip.sha256
          --title "${{ github.ref_name }}"
          --notes-file .github/release-notes.md
          --generate-notes
